name: Backend CI/CD

# build-test : compiles, runs unit + Karate tests (H2, no external service), Checkstyle, and publishes
#              the executable jar and the test/coverage reports as workflow artifacts.
# docker     : builds the runtime image and pushes it to GitHub Container Registry (ghcr.io).
# deploy     : optional: triggers the cloud platform's deploy hook once the image is published.
#              Enabled per GitHub environment (see docs/deployment.md), skipped otherwise.

on:
  push:
    branches: [master, main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: credit-bladi-api

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Unit + integration tests (Karate) and coverage
        run: ./mvnw -B -ntp verify

      - name: Checkstyle
        run: ./mvnw -B -ntp checkstyle:check

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: credit-bladi-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  docker:
    name: Docker image
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ github.ref_type == 'tag' && 'production' || 'staging' }})
    needs: docker
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - name: Trigger the platform deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.docker.outputs.image }}:sha-${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::DEPLOY_HOOK_URL secret is not set for this environment"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\",\"ref\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\"}" \
            "$DEPLOY_HOOK_URL"
          echo "Deploy requested for ${IMAGE}"

      - name: Smoke test
        if: vars.HEALTHCHECK_URL != ''
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 5 "$HEALTHCHECK_URL" | grep -q '"UP"'; then
              echo "Healthy: $HEALTHCHECK_URL"; exit 0
            fi
            sleep 10
          done
          echo "::error::$HEALTHCHECK_URL did not report UP within 5 minutes"
          exit 1
