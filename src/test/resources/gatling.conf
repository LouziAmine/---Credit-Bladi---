gatling {
  socket {
    connectTimeout = 61000
    tcpNoDelay = true
  }
  netty {
    useNativeTransport = true
    allocator = "pooled"
  }
  ssl {
    handshakeTimeout = 20000
    enableHostnameVerification = false
  }
  http {
    warmUpUrl = "http://localhost:8080"
    pooledConnectionIdleTimeout = 180000
    requestTimeout = 62000
    enableHostnameVerification = false
    dns {
      queryTimeout = 5000
    }
  }
  data {
    console {
    }
    file {
    }
    enableAnalytics = false
  }
}