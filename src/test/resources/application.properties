spring.application.name=Credit-Bladi

spring.datasource.url=jdbc:h2:mem:bladidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.liquibase.enabled=true

server.port=8080

springdoc.api-docs.path=/swagger/credit-bladi/v3/api-docs.json
springdoc.swagger-ui.path=/swagger/credit-bladi/v3/swagger-ui.html
code.version=@project.version@
credit.bladi.swagger.config.title=Credit Bladi API
credit.bladi.swagger.config.description=Moroccan mortgage simulator API — BAM regulatory rules (Bank Al-Maghrib)
credit.bladi.swagger.config.package=com.credit.bladi
credit.bladi.swagger.config.contact.name=Amine Louzi
credit.bladi.swagger.config.contact.email=louzi.amine.pro.pro@gmail.com

spring.jackson.deserialization.fail-on-trailing-tokens=true

security.jwt.secret=Y3JlZGl0QmxhZGlTZWNyZXRLZXlGb3JKV1RTaWduaW5nMjU2Yml0cw==
security.jwt.expiration-ms=86400000
security.jwt.refresh-expiration-ms=604800000
security.cookie.max-age-seconds=86400
security.cookie.secure=false
security.refresh-cookie.max-age-seconds=604800

security.cors.allowed-origin=http://localhost:4200

security.rate-limit.auth.max-requests=1000
security.rate-limit.simulation.max-requests=1000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=MANAGER
management.info.env.enabled=true

swagger.public=true

spring.liquibase.contexts=dev
