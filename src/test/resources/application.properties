spring.application.name=Credit-Bladi

spring.datasource.url=jdbc:h2:mem:bladidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.liquibase.enabled=true

server.port=8080

springdoc.api-docs.path=/swagger/credit-bladi/v3/api-docs.json
springdoc.swagger-ui.path=/swagger/credit-bladi/v3/swagger-ui.html
code.version=@project.version@
credit.bladi.swagger.config.title=Credit Bladi API
credit.bladi.swagger.config.description=Moroccan mortgage simulator API: BAM regulatory rules (Bank Al-Maghrib)
credit.bladi.swagger.config.package=com.credit.bladi
credit.bladi.swagger.config.contact.name=Amine Louzi
credit.bladi.swagger.config.contact.email=louzi.amine.pro.pro@gmail.com

spring.jackson.deserialization.fail-on-trailing-tokens=true

# test/resources/application.properties shadows main/resources/application.properties entirely
# (same classpath path), so the i18n basename registry lives in its own file and is imported here
# too: see src/main/resources/i18n/basenames.properties.
spring.config.import=classpath:i18n/basenames.properties

security.jwt.secret=Y3JlZGl0QmxhZGlTZWNyZXRLZXlGb3JKV1RTaWduaW5nMjU2Yml0cw==
security.jwt.expiration-ms=86400000
security.jwt.refresh-expiration-ms=604800000
security.cookie.max-age-seconds=86400
security.cookie.secure=false
security.refresh-cookie.max-age-seconds=604800

security.cors.allowed-origin=http://localhost:4200

security.rate-limit.auth.max-requests=1000
security.rate-limit.mortgage-credit.max-requests=1000
security.rate-limit.refresh.max-requests=1000
security.rate-limit.logout.max-requests=1000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=MANAGER
management.info.env.enabled=true

swagger.public=true

spring.liquibase.contexts=dev

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

app.document-storage.base-path=./target/test-documents
app.document-storage.max-file-size-bytes=15728640
app.document-storage.allowed-content-types=application/pdf,image/jpeg,image/png,\
application/vnd.openxmlformats-officedocument.wordprocessingml.document,\
application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
app.document-storage.antivirus.enabled=false

spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false
app.demand-import.max-file-size-bytes=15728640
app.demand-import.storage-path=./target/test-demand-imports
app.demand-import.max-skip-count=50

# Keep in sync with src/main/resources/application.properties: this file shadows it on the test
# classpath, so every placeholder a bean needs at startup must also be declared here.
notification.email.enabled=true
notification.email.from=no-reply@bladi-credit.ma
notification.sms.enabled=true
notification.sms.fakeCatcherAddress=sms-catcher@bladi-credit.ma
notification.locale=fr
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
sms.gateway.provider=mailpit
sms.gateway.url=
sms.gateway.api-key=
sms.gateway.sender-id=CreditBladi

credit.bladi.payment.beneficiary-name=Credit Bladi SA
credit.bladi.payment.beneficiary-rib=230 780 0123456789012345 03

bam.verification.provider=mock
bam.verification.mock.latency.min-ms=0
bam.verification.mock.latency.max-ms=0
bam.verification.gateway.url=
bam.verification.gateway.api-key=

workflow.four-eyes.enabled=true
credit.bladi.regulatory.max-annual-rate=14.00
credit.bladi.servicing.late-interest-margin-points=2.00
credit.bladi.servicing.early-repayment.indemnity-months-of-interest=1
credit.bladi.servicing.early-repayment.max-indemnity-share-of-outstanding=0.03
