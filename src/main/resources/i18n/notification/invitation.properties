invitation.subject=Invitation Credit Bladi: accès au portefeuille de {0}
invitation.body=Bonjour,\n\nVous avez été identifié comme contact de l''entreprise {0} sur un dossier de crédit Credit Bladi. Pour créer votre compte et suivre l''avancement de vos dossiers, cliquez sur le lien ci-dessous (valable 7 jours) :\n\n{1}\n\nSi vous n''êtes pas à l''origine de cette demande, ignorez cet email.
accountConfirmation.subject=Credit Bladi: votre compte a été créé
accountConfirmation.body=Bonjour,\n\nVotre compte Credit Bladi ("{0}") a été créé avec succès et vous avez maintenant accès au portefeuille de l''entreprise {1}. Vous pouvez dès à présent vous connecter :\n\n{2}\n\nSi vous n''êtes pas à l''origine de cette demande, contactez-nous.
invitation.borrower.subject=Credit Bladi: suivez votre crédit immobilier {0}
invitation.borrower.body=Bonjour,\n\nVotre dossier de crédit immobilier {0} est en cours de traitement chez Credit Bladi. Pour créer votre espace client, suivre votre dossier puis déclarer vos paiements, cliquez sur le lien ci-dessous (valable 7 jours) :\n\n{1}\n\nSi vous n''êtes pas à l''origine de cette demande, ignorez cet email.
accountConfirmation.borrower.body=Bonjour,\n\nVotre compte Credit Bladi ("{0}") a été créé avec succès et donne accès à votre dossier de crédit immobilier {1}. Vous pouvez dès à présent vous connecter :\n\n{2}\n\nSi vous n''êtes pas à l''origine de cette demande, contactez-nous.
