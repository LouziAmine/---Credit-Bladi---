invitation.subject=دعوة Credit Bladi: الوصول إلى محفظة {0}
invitation.body=مرحبًا،\n\nتم تحديدكم كجهة اتصال للشركة {0} في ملف قرض لدى Credit Bladi. لإنشاء حسابكم ومتابعة ملفاتكم، يرجى الضغط على الرابط أدناه (صالح لمدة 7 أيام):\n\n{1}\n\nإذا لم تكونوا في أصل هذا الطلب، يرجى تجاهل هذه الرسالة.
accountConfirmation.subject=Credit Bladi: تم إنشاء حسابكم
accountConfirmation.body=مرحبًا،\n\nتم إنشاء حسابكم في Credit Bladi ("{0}") بنجاح، وأصبح لديكم الآن صلاحية الوصول إلى محفظة الشركة {1}. يمكنكم تسجيل الدخول الآن:\n\n{2}\n\nإذا لم تكونوا في أصل هذا الطلب، يرجى التواصل معنا.
invitation.borrower.subject=Credit Bladi: تابعوا قرضكم العقاري {0}
invitation.borrower.body=مرحبًا،\n\nملف قرضكم العقاري {0} قيد المعالجة لدى Credit Bladi. لإنشاء فضائكم الخاص ومتابعة ملفكم ثم التصريح بأداءاتكم، يرجى الضغط على الرابط أدناه (صالح لمدة 7 أيام):\n\n{1}\n\nإذا لم تكونوا في أصل هذا الطلب، يرجى تجاهل هذه الرسالة.
accountConfirmation.borrower.body=مرحبًا،\n\nتم إنشاء حسابكم في Credit Bladi ("{0}") بنجاح، وهو يمنحكم الوصول إلى ملف قرضكم العقاري {1}. يمكنكم تسجيل الدخول الآن:\n\n{2}\n\nإذا لم تكونوا في أصل هذا الطلب، يرجى التواصل معنا.
