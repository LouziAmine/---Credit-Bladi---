validation.creditRate.rateMin.min=rateMin doit être strictement positif.
validation.creditRate.rateMin.max=rateMin dépasse le maximum raisonnable de 100 %.
validation.creditRate.rateMax.min=rateMax doit être strictement positif.
validation.creditRate.rateMax.max=rateMax dépasse le maximum raisonnable de 100 %.
validation.creditRate.minDurationMonths.min=minDurationMonths ne peut pas être négatif.
validation.creditRate.maxDurationMonths.min=maxDurationMonths ne peut pas être négatif.
validation.creditRate.rateFormula.pattern=rateFormula doit être MIN, MAX ou AVERAGE.
