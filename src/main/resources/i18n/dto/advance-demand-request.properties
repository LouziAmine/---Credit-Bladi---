validation.advanceDemand.note.size=note ne doit pas dépasser 500 caractères.
validation.advanceDemand.decisionOutcome.pattern=decisionOutcome doit être l'une des valeurs suivantes : APPROVED, DEFERRED, REJECTED.
validation.advanceDemand.returnReasonCode.size=returnReasonCode ne doit pas dépasser 100 caractères.
validation.advanceDemand.recommendations.size=recommendations ne doit pas dépasser 500 caractères.
validation.advanceDemand.reserves.size=reserves ne doit pas dépasser 500 caractères.
validation.advanceDemand.committeeType.pattern=committeeType doit être l'une des valeurs suivantes : ROTATING, STANDING_SESSION.
validation.advanceDemand.insuranceCoverageType.pattern=insuranceCoverageType doit être l'une des valeurs suivantes : BANK_GROUP_POLICY, EXTERNAL_DELEGATION.
validation.advanceDemand.assigneeUsername.size=assigneeUsername ne doit pas dépasser 100 caractères.
validation.advanceDemand.rateOption.notBlank=rateOption est requis : choisissez KEEP ou MANUAL à chaque avancement/retour.
validation.advanceDemand.rateOption.pattern=rateOption doit être l'une des valeurs suivantes : KEEP, MANUAL.
validation.advanceDemand.manualRate.min=manualRate doit être strictement positif.
validation.advanceDemand.manualRate.max=manualRate ne doit pas dépasser 100.
validation.advanceDemand.amountOption.notBlank=amountOption est requis : choisissez KEEP ou MANUAL à chaque avancement/retour.
validation.advanceDemand.amountOption.pattern=amountOption doit être l'une des valeurs suivantes : KEEP, MANUAL.
validation.advanceDemand.manualAmount.min=Le montant minimum est 50000.
validation.advanceDemand.manualAmount.max=Le montant maximum est 100000000.
validation.advanceDemand.durationOption.notBlank=durationOption est requis : choisissez KEEP ou MANUAL à chaque avancement/retour.
validation.advanceDemand.durationOption.pattern=durationOption doit être l'une des valeurs suivantes : KEEP, MANUAL.
validation.advanceDemand.manualDuration.min=La durée minimum est de 12 mois.
validation.advanceDemand.manualDuration.max=La durée maximum est de 300 mois.
