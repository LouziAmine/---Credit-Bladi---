workflow.workflowNotConfigured=Aucun circuit de traitement actif n'est configuré pour ce type d'entreprise.
workflow.demandNotFound=Dossier introuvable pour cet identifiant.
workflow.stepNotFound=Étape de circuit introuvable pour ce dossier.
workflow.noNextStep=Ce dossier est déjà à sa dernière étape et ne peut plus être avancé.
workflow.noPreviousStep=Ce dossier est déjà à sa première étape et ne peut plus être retourné pour complément.
workflow.actorNotEligibleForStep=Votre profil grade/équipe ne correspond pas à celui requis par l'étape actuelle de ce dossier.
workflow.actorNotAssignedToStep=Cette étape est assignée à un autre utilisateur: demandez-lui de vous la réassigner via POST /assign.
workflow.assignerNotEligibleForStep=Seul un membre de l'équipe requise par l'étape actuelle de ce dossier peut l'assigner.
workflow.assigneeNotEligibleForStep=Le profil grade/équipe de l'utilisateur cible ne correspond pas à celui requis par l'étape actuelle de ce dossier.
workflow.nextAssigneeRequired=assigneeUsername est requis : un dossier ne peut avancer ou revenir à une étape sans désigner qui en prend la responsabilité, sauf si le dossier est en cours de finalisation.
workflow.rateOptionKeepUnavailable=Ce dossier n'a pas encore de taux applicable actuel (créé avant l'existence de ce champ, ou jamais avancé): rateOption=KEEP n'est pas disponible ; choisissez MANUAL à la place.
workflow.manualRateRequired=manualRate est requis lorsque rateOption=MANUAL.
workflow.manualAmountRequired=manualAmount est requis lorsque amountOption=MANUAL.
workflow.manualDurationRequired=manualDuration est requis lorsque durationOption=MANUAL.
workflow.fileTypeNotAllowed=Ce type de fichier n'est pas autorisé. Types autorisés : PDF, JPEG, PNG, DOCX, XLSX.
workflow.fileTooLarge=Ce fichier dépasse la taille maximale autorisée pour le téléversement.
workflow.fileInfected=Ce fichier a été rejeté par l'analyse antivirus et n'a pas été enregistré.
workflow.documentNotFound=Document introuvable pour cet identifiant sur ce dossier.
workflow.documentNotReady=Ce document n'a pas encore terminé son analyse antivirus et ne peut pas être téléchargé.
workflow.notAtClassificationStep=Ce dossier n'est actuellement pas à l'étape CLASSIFICATION_STEP: POST /classify ne s'applique qu'à la toute première étape d'un dossier.
workflow.enterpriseRequiredForRealClassification=enterpriseId est requis lorsque classificationOutcome=REAL.
workflow.mustClassifyFirst=Ce dossier est encore à l'étape CLASSIFICATION_STEP: utilisez POST /{id}/classify au lieu de /advance.
workflow.insuranceAdiRequired=insuranceAdiSubscribed doit être à true pour avancer au-delà de l'étape INSURANCE_VALIDATION_STEP.
workflow.insuranceDamageRequired=insuranceDamageSubscribed doit être à true pour avancer au-delà de l'étape INSURANCE_VALIDATION_STEP lorsque le dossier a une valeur de garanties non nulle.
workflow.decisionDeferredRequiresReturn=Le comité a ajourné ce dossier (decisionOutcome=DEFERRED) : il ne peut pas avancer vers l'étape suivante: renvoyez-le pour complément avec un returnReasonCode.
workflow.fourEyesViolation=Principe des quatre yeux : vous avez déjà traité une étape précédente de ce dossier, la décision doit être prise par une autre personne.
workflow.rateAboveLegalMaximum=Le taux saisi dépasse le taux maximum des intérêts conventionnels fixé par Bank Al-Maghrib.
workflow.termsFrozenAfterDecision=Les conditions (montant, taux, durée) ont été fixées par la décision du comité et ne peuvent plus être modifiées à cette étape. Renvoyez le dossier à l'étape de décision pour les changer.
