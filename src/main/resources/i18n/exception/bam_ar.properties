bam.durationLimitExceeded=مدة القرض خارج النطاق المسموح به لهذه الفئة السوسيو-مهنية (وفقًا لتنظيمات بنك المغرب).
bam.ageLimitExceeded=يتجاوز تاريخ استحقاق القرض الحد الأقصى للسن المسموح به عند الاستحقاق (وفقًا لتنظيمات بنك المغرب).
bam.depositInsufficient=يتجاوز مبلغ القرض {0}% من قيمة العقار. يُشترط تقديم دفعة أولى لا تقل عن {1}% (وفقًا لتنظيمات بنك المغرب).
bam.debtRatioExceeded=يتجاوز القسط الشهري {0}% من الدخل الشهري المصرح به (وفقًا لتنظيمات بنك المغرب).
