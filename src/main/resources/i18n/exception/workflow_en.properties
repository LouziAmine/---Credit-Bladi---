workflow.workflowNotConfigured=No active workflow pipeline is configured for this enterprise type.
workflow.demandNotFound=Demand not found for the given ID.
workflow.stepNotFound=Workflow step not found for this demand.
workflow.noNextStep=This demand is already at its final step and cannot be advanced further.
workflow.noPreviousStep=This demand is already at its first step and cannot be returned for completion further.
workflow.actorNotEligibleForStep=Your grade/team profile does not match the one required by this demand's current step.
workflow.actorNotAssignedToStep=This step is assigned to another user: ask them to reassign it to you via POST /assign.
workflow.assignerNotEligibleForStep=Only a member of the team required by this demand's current step can assign it.
workflow.assigneeNotEligibleForStep=The target user's grade/team profile does not match the one required by this demand's current step.
workflow.nextAssigneeRequired=assigneeUsername is required: a demand cannot advance or return to a step without designating who takes ownership of it, unless the demand is being completed.
workflow.rateOptionKeepUnavailable=This demand does not have a current applicable rate yet (created before this field existed, or never advanced): rateOption=KEEP is unavailable; choose MANUAL instead.
workflow.manualRateRequired=manualRate is required when rateOption=MANUAL.
workflow.manualAmountRequired=manualAmount is required when amountOption=MANUAL.
workflow.manualDurationRequired=manualDuration is required when durationOption=MANUAL.
workflow.fileTypeNotAllowed=This file type is not allowed. Allowed types: PDF, JPEG, PNG, DOCX, XLSX.
workflow.fileTooLarge=This file exceeds the maximum allowed upload size.
workflow.fileInfected=This file was rejected by the antivirus scan and was not stored.
workflow.documentNotFound=Document not found for the given ID on this demand.
workflow.documentNotReady=This document has not completed its antivirus scan yet and cannot be downloaded.
workflow.notAtClassificationStep=This demand is not currently at CLASSIFICATION_STEP: POST /classify only applies to a demand's very first step.
workflow.enterpriseRequiredForRealClassification=enterpriseId is required when classificationOutcome=REAL.
workflow.mustClassifyFirst=This demand is still at CLASSIFICATION_STEP: use POST /{id}/classify instead of /advance.
workflow.insuranceAdiRequired=insuranceAdiSubscribed must be true to advance past INSURANCE_VALIDATION_STEP.
workflow.insuranceDamageRequired=insuranceDamageSubscribed must be true to advance past INSURANCE_VALIDATION_STEP when the demand has a non-zero guaranteesValue.
workflow.decisionDeferredRequiresReturn=The committee deferred this demand (decisionOutcome=DEFERRED): it cannot move forward: return it for completion with a returnReasonCode instead.
workflow.fourEyesViolation=Four-eyes principle: you already handled an earlier step of this demand, so the decision must be taken by someone else.
workflow.rateAboveLegalMaximum=The rate entered exceeds the maximum conventional interest rate set by Bank Al-Maghrib.
workflow.termsFrozenAfterDecision=The terms (amount, rate, duration) were set by the committee decision and can no longer be changed at this step. Return the dossier to the decision step to change them.
