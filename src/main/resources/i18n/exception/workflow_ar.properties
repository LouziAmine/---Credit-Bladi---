workflow.workflowNotConfigured=لا يوجد مسار معالجة نشط مهيأ لهذا النوع من الشركات.
workflow.demandNotFound=لم يتم العثور على الملف لهذا المعرف.
workflow.stepNotFound=لم يتم العثور على مرحلة المسار لهذا الملف.
workflow.noNextStep=هذا الملف موجود بالفعل في مرحلته الأخيرة ولا يمكن تقديمه أكثر.
workflow.noPreviousStep=هذا الملف موجود بالفعل في مرحلته الأولى ولا يمكن إعادته لمزيد من الإكمال.
workflow.actorNotEligibleForStep=لا يتطابق ملفك الشخصي (الرتبة/الفريق) مع المطلوب في المرحلة الحالية لهذا الملف.
workflow.actorNotAssignedToStep=هذه المرحلة مسندة إلى مستخدم آخر: يرجى أن يقوم بإعادة إسنادها إليك عبر POST /assign.
workflow.assignerNotEligibleForStep=يمكن فقط لعضو من الفريق المطلوب في المرحلة الحالية لهذا الملف إسناده.
workflow.assigneeNotEligibleForStep=لا يتطابق ملف المستخدم المستهدف (الرتبة/الفريق) مع المطلوب في المرحلة الحالية لهذا الملف.
workflow.nextAssigneeRequired=الحقل assigneeUsername مطلوب: لا يمكن لملف أن يتقدم أو يعود إلى مرحلة دون تحديد من يتولى مسؤوليته، إلا إذا كان الملف قيد الإنهاء.
workflow.rateOptionKeepUnavailable=لا يتوفر لهذا الملف حاليًا معدل قابل للتطبيق (تم إنشاؤه قبل وجود هذا الحقل، أو لم يتقدم أبدًا): الخيار rateOption=KEEP غير متاح؛ يرجى اختيار MANUAL بدلاً من ذلك.
workflow.manualRateRequired=الحقل manualRate مطلوب عندما يكون rateOption=MANUAL.
workflow.manualAmountRequired=الحقل manualAmount مطلوب عندما يكون amountOption=MANUAL.
workflow.manualDurationRequired=الحقل manualDuration مطلوب عندما يكون durationOption=MANUAL.
workflow.fileTypeNotAllowed=نوع هذا الملف غير مسموح به. الأنواع المسموح بها: PDF، JPEG، PNG، DOCX، XLSX.
workflow.fileTooLarge=يتجاوز هذا الملف الحجم الأقصى المسموح به للتحميل.
workflow.fileInfected=تم رفض هذا الملف بواسطة فحص مكافحة الفيروسات ولم يتم تخزينه.
workflow.documentNotFound=لم يتم العثور على المستند لهذا المعرف في هذا الملف.
workflow.documentNotReady=لم يكتمل فحص مكافحة الفيروسات لهذا المستند بعد ولا يمكن تنزيله.
workflow.notAtClassificationStep=هذا الملف ليس حاليًا في مرحلة CLASSIFICATION_STEP: لا ينطبق POST /classify إلا على المرحلة الأولى من الملف.
workflow.enterpriseRequiredForRealClassification=الحقل enterpriseId مطلوب عندما يكون classificationOutcome=REAL.
workflow.mustClassifyFirst=هذا الملف لا يزال في مرحلة CLASSIFICATION_STEP: استخدم POST /{id}/classify بدلاً من /advance.
workflow.insuranceAdiRequired=يجب أن تكون قيمة insuranceAdiSubscribed صحيحة (true) للتقدم بعد مرحلة INSURANCE_VALIDATION_STEP.
workflow.insuranceDamageRequired=يجب أن تكون قيمة insuranceDamageSubscribed صحيحة (true) للتقدم بعد مرحلة INSURANCE_VALIDATION_STEP عندما يكون للملف قيمة ضمانات غير صفرية.
workflow.decisionDeferredRequiresReturn=أجّلت اللجنة هذا الملف (decisionOutcome=DEFERRED): لا يمكن نقله إلى المرحلة التالية: أعيدوه للاستكمال مع returnReasonCode.
workflow.fourEyesViolation=مبدأ العيون الأربع: لقد عالجتم مرحلة سابقة من هذا الملف، لذا يجب أن يتخذ القرار شخص آخر.
workflow.rateAboveLegalMaximum=يتجاوز السعر المُدخل الحد الأقصى لسعر الفائدة الاتفاقية الذي حدده بنك المغرب.
workflow.termsFrozenAfterDecision=تم تحديد الشروط (المبلغ، السعر، المدة) بقرار اللجنة ولا يمكن تعديلها في هذه المرحلة. أعيدوا الملف إلى مرحلة القرار لتغييرها.
