spring.datasource.url=jdbc:h2:mem:bladidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.hikari.maximum-pool-size=30

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

security.jwt.secret=${JWT_SECRET}
security.cookie.secure=false
security.refresh-cookie.max-age-seconds=604800

security.cors.allowed-origin=http://localhost:4200

swagger.public=true

spring.liquibase.contexts=dev

logging.level.root=INFO
logging.level.com.credit.bladi=DEBUG
