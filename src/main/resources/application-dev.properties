spring.datasource.url=jdbc:postgresql://localhost:5432/bladidb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=bladi
spring.datasource.password=bladi

spring.datasource.hikari.maximum-pool-size=30

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Dev-only fallback so a fresh clone starts without any setup; staging and prod require JWT_SECRET.
security.jwt.secret=${JWT_SECRET:lXNcvdv9HN5E8nYWWB99KXjig4a+d2cydIUUBS+qMBI=}
security.cookie.secure=false
security.refresh-cookie.max-age-seconds=604800

security.cors.allowed-origin=http://localhost:4200

swagger.public=true

spring.liquibase.contexts=dev
spring.liquibase.drop-first=true

logging.level.root=INFO
logging.level.com.credit.bladi=DEBUG

app.document-storage.base-path=./data/documents
app.document-storage.encryption-key=${DOCUMENT_ENCRYPTION_KEY:}
app.document-storage.antivirus.enabled=true
app.document-storage.antivirus.host=localhost
app.document-storage.antivirus.port=3310

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

sms.gateway.provider=http
sms.gateway.url=http://localhost:8080/api/v1/fake-sms-gateway/sms
sms.gateway.api-key=dev-fake-key
sms.gateway.sender-id=CreditBladi

workflow.four-eyes.enabled=false
