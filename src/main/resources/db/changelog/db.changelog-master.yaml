- changeSet:
    id: 003-mortgage-borrower-access
    author: bladi
    comment: A mortgage borrower has no enterprise, so portal access is granted per dossier. An invitation can now target a
      dossier (demand_id, no enterprise) and mortgage_borrower records which client account owns which mortgage dossier.
    changes:
    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS mortgage_borrower (
            demand_id   BIGINT PRIMARY KEY,
            user_id     BIGINT NOT NULL,
            origin      VARCHAR(40) NOT NULL,
            linked_by   VARCHAR(100),
            linked_at   TIMESTAMP NOT NULL
          );
          ALTER TABLE mortgage_borrower ADD CONSTRAINT fk_mortgage_borrower_demand FOREIGN KEY (demand_id) REFERENCES demand(id);
          ALTER TABLE mortgage_borrower ADD CONSTRAINT fk_mortgage_borrower_user FOREIGN KEY (user_id) REFERENCES app_user(id);
          CREATE INDEX IF NOT EXISTS idx_mortgage_borrower_user ON mortgage_borrower (user_id);

          ALTER TABLE client_invitation ALTER COLUMN enterprise_id DROP NOT NULL;
          ALTER TABLE client_invitation ALTER COLUMN role DROP NOT NULL;
          DROP INDEX IF EXISTS idx_client_invitation_unique_active;
          ALTER TABLE client_invitation DROP COLUMN active_invitation_key;
    - sql:
        dbms: h2
        sql: |
          ALTER TABLE client_invitation
            ADD COLUMN active_invitation_key VARCHAR(280)
            GENERATED ALWAYS AS (CASE WHEN status = 'PENDING'
              THEN email || ':' || COALESCE(CAST(enterprise_id AS VARCHAR), 'demand-' || CAST(demand_id AS VARCHAR))
              ELSE NULL END);
          CREATE UNIQUE INDEX IF NOT EXISTS idx_client_invitation_unique_active
          ON client_invitation (active_invitation_key);
    - sql:
        dbms: postgresql
        sql: |
          ALTER TABLE client_invitation
            ADD COLUMN active_invitation_key VARCHAR(280)
            GENERATED ALWAYS AS (CASE WHEN status = 'PENDING'
              THEN email || ':' || COALESCE(CAST(enterprise_id AS VARCHAR), 'demand-' || CAST(demand_id AS VARCHAR))
              ELSE NULL END) STORED;
          CREATE UNIQUE INDEX IF NOT EXISTS idx_client_invitation_unique_active
          ON client_invitation (active_invitation_key);
    rollback:
    - sql:
        sql: |
          DROP TABLE IF EXISTS mortgage_borrower;
- changeSet:
    id: 004-demand-agreed-pricing
    author: bladi
    comment: Pricing parameters in force when the committee approved a dossier (fees, borrower insurance, Mourabaha VAT
      and takaful), so editing a grid after the decision never changes an approved client's schedule.
    changes:
    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS demand_agreed_pricing (
            demand_id                           BIGINT PRIMARY KEY,
            processing_fees_ratio               DECIMAL(10,6),
            min_processing_fees                 DECIMAL(15,2),
            max_processing_fees                 DECIMAL(15,2),
            registration_fee_ratio              DECIMAL(10,6),
            land_conservation_ratio             DECIMAL(10,6),
            notary_fee_ratio                    DECIMAL(10,6),
            adi_monthly_rate                    DECIMAL(10,6),
            vat_rate                            DECIMAL(10,6),
            takaful_monthly_rate                DECIMAL(10,6),
            investment_processing_fees_ratio    DECIMAL(10,6),
            investment_insurance_premium_ratio  DECIMAL(10,6),
            captured_at                         TIMESTAMP NOT NULL,
            captured_by                         VARCHAR(100)
          );
          ALTER TABLE demand_agreed_pricing ADD CONSTRAINT fk_demand_agreed_pricing_demand
            FOREIGN KEY (demand_id) REFERENCES demand(id);
    rollback:
    - sql:
        sql: |
          DROP TABLE IF EXISTS demand_agreed_pricing;
