databaseChangeLog:
- changeSet:
    id: 001-baseline
    author: bladi
    comment: Complete Credit Bladi schema and reference data. Every new database is built from this baseline; each later change
      is a new changeset appended after it, never an edit of this one once a shared environment has run it.
    changes:
    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS credit_rate (
            id                   BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            csp_code             VARCHAR(10) NOT NULL,
            rate_min             DECIMAL(5,2),
            rate_max             DECIMAL(5,2),
            min_duration_months  INT,
            max_duration_months  INT,
            active               BOOLEAN DEFAULT TRUE,
            version              BIGINT NOT NULL DEFAULT 0,
            public_id            UUID NOT NULL,
            rate_formula         VARCHAR(10) NOT NULL DEFAULT 'AVERAGE',
            CONSTRAINT uq_credit_rate_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS bam_parameters (
            id                      BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            processing_fees_ratio   DECIMAL(6,4) NOT NULL,
            min_processing_fees     DECIMAL(10,2) NOT NULL,
            max_processing_fees     DECIMAL(10,2) NOT NULL,
            registration_fee_ratio  DECIMAL(6,4) NOT NULL,
            land_conservation_ratio DECIMAL(6,4) NOT NULL,
            notary_fee_ratio        DECIMAL(6,4) NOT NULL,
            active                  BOOLEAN DEFAULT TRUE,
            ltv_ratio               DECIMAL(5,4) NOT NULL DEFAULT 0.9000,
            max_debt_ratio          DECIMAL(5,4) NOT NULL DEFAULT 0.4000,
            max_age_at_maturity     INT NOT NULL DEFAULT 75,
            adi_monthly_rate        DECIMAL(6,4) NOT NULL DEFAULT 0.0004,
            version                 BIGINT NOT NULL DEFAULT 0,
            public_id               UUID NOT NULL,
            CONSTRAINT uq_bam_parameters_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS mourabaha_parameters (
            id                    BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            profit_rate           DECIMAL(5,2) NOT NULL,
            vat_rate              DECIMAL(6,4) NOT NULL,
            active                BOOLEAN DEFAULT TRUE,
            version               BIGINT NOT NULL DEFAULT 0,
            public_id             UUID NOT NULL,
            takaful_monthly_rate  DECIMAL(6,4) NOT NULL DEFAULT 0.0004,
            CONSTRAINT uq_mourabaha_parameters_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS enterprise_credit_parameters (
            id                              BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            enterprise_type                 VARCHAR(20) NOT NULL,
            rate_min                        DECIMAL(5,2) NOT NULL,
            rate_max                        DECIMAL(5,2) NOT NULL,
            min_company_age_years           INT NOT NULL,
            max_financing_to_revenue_ratio  DECIMAL(5,4) NOT NULL,
            min_guarantee_coverage_ratio    DECIMAL(5,4) NOT NULL,
            max_debt_service_ratio          DECIMAL(5,4) NOT NULL,
            processing_fees_ratio           DECIMAL(6,4) NOT NULL,
            active                          BOOLEAN DEFAULT TRUE,
            version                         BIGINT NOT NULL DEFAULT 0,
            insurance_premium_ratio         DECIMAL(6,4) NOT NULL DEFAULT 0.0010,
            public_id                       UUID NOT NULL,
            rate_formula                    VARCHAR(10) NOT NULL DEFAULT 'AVERAGE',
            CONSTRAINT uq_enterprise_credit_parameters_public_id UNIQUE (public_id)
          );
    - sql:
        dbms: h2
        sql: |
          ALTER TABLE credit_rate
            ADD COLUMN active_csp_code VARCHAR(10)
            GENERATED ALWAYS AS (CASE WHEN active THEN csp_code ELSE NULL END);
          CREATE UNIQUE INDEX IF NOT EXISTS idx_credit_rate_unique_active_csp
          ON credit_rate (active_csp_code);

          ALTER TABLE bam_parameters
            ADD COLUMN active_marker INT
            GENERATED ALWAYS AS (CASE WHEN active THEN 1 ELSE NULL END);
          CREATE UNIQUE INDEX IF NOT EXISTS idx_bam_parameters_unique_active
          ON bam_parameters (active_marker);

          ALTER TABLE mourabaha_parameters
            ADD COLUMN active_marker INT
            GENERATED ALWAYS AS (CASE WHEN active THEN 1 ELSE NULL END);
          CREATE UNIQUE INDEX IF NOT EXISTS idx_mourabaha_parameters_unique_active
          ON mourabaha_parameters (active_marker);

          ALTER TABLE enterprise_credit_parameters
            ADD COLUMN active_enterprise_type VARCHAR(20)
            GENERATED ALWAYS AS (CASE WHEN active THEN enterprise_type ELSE NULL END);
          CREATE UNIQUE INDEX IF NOT EXISTS idx_enterprise_credit_parameters_unique_active
          ON enterprise_credit_parameters (active_enterprise_type);
    - sql:
        dbms: postgresql
        sql: |
          ALTER TABLE credit_rate
            ADD COLUMN active_csp_code VARCHAR(10)
            GENERATED ALWAYS AS (CASE WHEN active THEN csp_code ELSE NULL END) STORED;
          CREATE UNIQUE INDEX IF NOT EXISTS idx_credit_rate_unique_active_csp
          ON credit_rate (active_csp_code);

          ALTER TABLE bam_parameters
            ADD COLUMN active_marker INT
            GENERATED ALWAYS AS (CASE WHEN active THEN 1 ELSE NULL END) STORED;
          CREATE UNIQUE INDEX IF NOT EXISTS idx_bam_parameters_unique_active
          ON bam_parameters (active_marker);

          ALTER TABLE mourabaha_parameters
            ADD COLUMN active_marker INT
            GENERATED ALWAYS AS (CASE WHEN active THEN 1 ELSE NULL END) STORED;
          CREATE UNIQUE INDEX IF NOT EXISTS idx_mourabaha_parameters_unique_active
          ON mourabaha_parameters (active_marker);

          ALTER TABLE enterprise_credit_parameters
            ADD COLUMN active_enterprise_type VARCHAR(20)
            GENERATED ALWAYS AS (CASE WHEN active THEN enterprise_type ELSE NULL END) STORED;
          CREATE UNIQUE INDEX IF NOT EXISTS idx_enterprise_credit_parameters_unique_active
          ON enterprise_credit_parameters (active_enterprise_type);
