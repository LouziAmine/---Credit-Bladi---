    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS notification (
            id         BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            username   VARCHAR(100) NOT NULL,
            type       VARCHAR(50) NOT NULL,
            title      VARCHAR(200) NOT NULL,
            body       VARCHAR(1000) NOT NULL,
            link       VARCHAR(500),
            read       BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMP NOT NULL,
            public_id  UUID NOT NULL,
            CONSTRAINT uq_notification_public_id UNIQUE (public_id)
          );
    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS credit_file (
            id                    BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            demand_id             BIGINT NOT NULL,
            reference             VARCHAR(30) NOT NULL,
            disbursed_at          TIMESTAMP NOT NULL,
            disbursed_amount      DECIMAL(19,2) NOT NULL,
            status                VARCHAR(20) NOT NULL DEFAULT 'ACTIVE',
            managed_by_username   VARCHAR(100),
            version               BIGINT NOT NULL DEFAULT 0,
            deleted_at            TIMESTAMP,
            public_id             UUID NOT NULL,
            CONSTRAINT uq_credit_file_demand_id UNIQUE (demand_id),
            CONSTRAINT uq_credit_file_reference UNIQUE (reference),
            CONSTRAINT uq_credit_file_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS installment (
            id                     BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            credit_file_id         BIGINT NOT NULL,
            sequence_number        INT NOT NULL,
            due_date               DATE NOT NULL,
            amount                 DECIMAL(19,2) NOT NULL,
            status                 VARCHAR(20) NOT NULL DEFAULT 'PENDING',
            paid_at                TIMESTAMP,
            last_reminder_sent_at  TIMESTAMP,
            declared_at            TIMESTAMP,
            declared_by            VARCHAR(100),
            declared_source_rib    VARCHAR(34),
            late_penalty           DECIMAL(19,2),
            version                BIGINT NOT NULL DEFAULT 0,
            public_id              UUID NOT NULL,
            CONSTRAINT uq_installment_credit_file_sequence UNIQUE (credit_file_id, sequence_number),
            CONSTRAINT uq_installment_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS payment (
            id              BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            installment_id  BIGINT NOT NULL,
            amount          DECIMAL(19,2) NOT NULL,
            paid_at         TIMESTAMP NOT NULL
          );

          CREATE TABLE IF NOT EXISTS early_repayment (
            id                  BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            public_id           UUID NOT NULL,
            credit_file_id      BIGINT NOT NULL,
            full_repayment      BOOLEAN NOT NULL,
            outstanding_before  DECIMAL(19,2) NOT NULL,
            repaid_principal    DECIMAL(19,2) NOT NULL,
            accrued_interest    DECIMAL(19,2) NOT NULL,
            indemnity           DECIMAL(19,2) NOT NULL,
            total_paid          DECIMAL(19,2) NOT NULL,
            outstanding_after   DECIMAL(19,2) NOT NULL,
            performed_by        VARCHAR(100) NOT NULL,
            performed_at        TIMESTAMP NOT NULL,
            CONSTRAINT uq_early_repayment_public_id UNIQUE (public_id)
          );
    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS demand_import_row_error (
            id                BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            job_execution_id  BIGINT NOT NULL,
            row_number        INT NOT NULL,
            company_name      VARCHAR(200),
            error_message     VARCHAR(500) NOT NULL,
            created_at        TIMESTAMP NOT NULL
          );
    - sql:
        dbms: h2
        sql: |
          CREATE TABLE IF NOT EXISTS BATCH_JOB_INSTANCE (
            JOB_INSTANCE_ID BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            VERSION BIGINT,
            JOB_NAME VARCHAR(100) NOT NULL,
            JOB_KEY VARCHAR(32) NOT NULL,
            constraint JOB_INST_UN unique (JOB_NAME, JOB_KEY)
          );

          CREATE TABLE IF NOT EXISTS BATCH_JOB_EXECUTION (
            JOB_EXECUTION_ID BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            VERSION BIGINT,
            JOB_INSTANCE_ID BIGINT NOT NULL,
            CREATE_TIME TIMESTAMP(9) NOT NULL,
            START_TIME TIMESTAMP(9) DEFAULT NULL,
            END_TIME TIMESTAMP(9) DEFAULT NULL,
            STATUS VARCHAR(10),
            EXIT_CODE VARCHAR(2500),
            EXIT_MESSAGE VARCHAR(2500),
            LAST_UPDATED TIMESTAMP(9),
            constraint JOB_INST_EXEC_FK foreign key (JOB_INSTANCE_ID)
            references BATCH_JOB_INSTANCE(JOB_INSTANCE_ID)
          );

          CREATE TABLE IF NOT EXISTS BATCH_JOB_EXECUTION_PARAMS (
            JOB_EXECUTION_ID BIGINT NOT NULL,
            PARAMETER_NAME VARCHAR(100) NOT NULL,
            PARAMETER_TYPE VARCHAR(100) NOT NULL,
            PARAMETER_VALUE VARCHAR(2500),
            IDENTIFYING CHAR(1) NOT NULL,
            constraint JOB_EXEC_PARAMS_FK foreign key (JOB_EXECUTION_ID)
            references BATCH_JOB_EXECUTION(JOB_EXECUTION_ID)
          );

          CREATE TABLE IF NOT EXISTS BATCH_STEP_EXECUTION (
            STEP_EXECUTION_ID BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            VERSION BIGINT NOT NULL,
            STEP_NAME VARCHAR(100) NOT NULL,
            JOB_EXECUTION_ID BIGINT NOT NULL,
            CREATE_TIME TIMESTAMP(9) NOT NULL,
            START_TIME TIMESTAMP(9) DEFAULT NULL,
            END_TIME TIMESTAMP(9) DEFAULT NULL,
            STATUS VARCHAR(10),
            COMMIT_COUNT BIGINT,
            READ_COUNT BIGINT,
            FILTER_COUNT BIGINT,
            WRITE_COUNT BIGINT,
            READ_SKIP_COUNT BIGINT,
            WRITE_SKIP_COUNT BIGINT,
            PROCESS_SKIP_COUNT BIGINT,
            ROLLBACK_COUNT BIGINT,
            EXIT_CODE VARCHAR(2500),
            EXIT_MESSAGE VARCHAR(2500),
            LAST_UPDATED TIMESTAMP(9),
            constraint JOB_EXEC_STEP_FK foreign key (JOB_EXECUTION_ID)
            references BATCH_JOB_EXECUTION(JOB_EXECUTION_ID)
          );

          CREATE TABLE IF NOT EXISTS BATCH_STEP_EXECUTION_CONTEXT (
            STEP_EXECUTION_ID BIGINT NOT NULL PRIMARY KEY,
            SHORT_CONTEXT VARCHAR(2500) NOT NULL,
            SERIALIZED_CONTEXT LONGVARCHAR,
            constraint STEP_EXEC_CTX_FK foreign key (STEP_EXECUTION_ID)
            references BATCH_STEP_EXECUTION(STEP_EXECUTION_ID)
          );

          CREATE TABLE IF NOT EXISTS BATCH_JOB_EXECUTION_CONTEXT (
            JOB_EXECUTION_ID BIGINT NOT NULL PRIMARY KEY,
            SHORT_CONTEXT VARCHAR(2500) NOT NULL,
            SERIALIZED_CONTEXT LONGVARCHAR,
            constraint JOB_EXEC_CTX_FK foreign key (JOB_EXECUTION_ID)
            references BATCH_JOB_EXECUTION(JOB_EXECUTION_ID)
          );

          CREATE SEQUENCE IF NOT EXISTS BATCH_STEP_EXECUTION_SEQ;
          CREATE SEQUENCE IF NOT EXISTS BATCH_JOB_EXECUTION_SEQ;
          CREATE SEQUENCE IF NOT EXISTS BATCH_JOB_INSTANCE_SEQ;
