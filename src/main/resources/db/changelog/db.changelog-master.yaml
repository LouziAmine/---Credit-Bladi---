    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS app_user (
            id        BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            username  VARCHAR(100) NOT NULL UNIQUE,
            password  VARCHAR(255) NOT NULL,
            role      VARCHAR(50)  NOT NULL DEFAULT 'CLIENT',
            grade_id  BIGINT,
            team_id   BIGINT,
            full_name VARCHAR(200),
            email     VARCHAR(255),
            preferred_language VARCHAR(2),
            public_id UUID NOT NULL,
            CONSTRAINT uq_app_user_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS revoked_token (
            id         BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            expires_at BIGINT NOT NULL,
            token_hash VARCHAR(64),
            public_id  UUID NOT NULL,
            CONSTRAINT uq_revoked_token_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS refresh_token (
            id         BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            user_id    BIGINT  NOT NULL,
            expires_at BIGINT  NOT NULL,
            revoked    BOOLEAN NOT NULL DEFAULT FALSE,
            token_hash VARCHAR(64),
            public_id  UUID NOT NULL,
            CONSTRAINT uq_refresh_token_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS audit_log (
            id           BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            username     VARCHAR(100),
            action       VARCHAR(100) NOT NULL,
            ip_address   VARCHAR(45),
            details      VARCHAR(500),
            performed_at TIMESTAMP NOT NULL,
            entity_type  VARCHAR(30),
            entity_public_id UUID,
            public_id    UUID NOT NULL,
            CONSTRAINT uq_audit_log_public_id UNIQUE (public_id)
          );
    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS grade (
            id        BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            code      VARCHAR(50) NOT NULL UNIQUE,
            name      VARCHAR(200) NOT NULL,
            public_id UUID NOT NULL,
            CONSTRAINT uq_grade_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS team (
            id        BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            code      VARCHAR(50) NOT NULL UNIQUE,
            name      VARCHAR(200) NOT NULL,
            public_id UUID NOT NULL,
            CONSTRAINT uq_team_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS process (
            id        BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            code      VARCHAR(50) NOT NULL UNIQUE,
            name      VARCHAR(200) NOT NULL,
            public_id UUID NOT NULL,
            CONSTRAINT uq_process_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS step (
            id                               BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            code                             VARCHAR(50) NOT NULL UNIQUE,
            name                             VARCHAR(200) NOT NULL,
            typical_role                     VARCHAR(200),
            required_grade_id                BIGINT,
            public_id                        UUID NOT NULL,
            requires_classification          BOOLEAN NOT NULL DEFAULT FALSE,
            requires_insurance_confirmation  BOOLEAN NOT NULL DEFAULT FALSE,
            requires_four_eyes               BOOLEAN NOT NULL DEFAULT FALSE,
            notify_contact_on_enter_type     VARCHAR(50),
            CONSTRAINT uq_step_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS workflow (
            id        BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            code      VARCHAR(50) NOT NULL UNIQUE,
            name      VARCHAR(200) NOT NULL,
            active    BOOLEAN DEFAULT TRUE,
            public_id UUID NOT NULL,
            CONSTRAINT uq_workflow_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS workflow_process (
            id             BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            workflow_id    BIGINT NOT NULL,
            process_id     BIGINT NOT NULL,
            sequence_order INT NOT NULL,
            public_id      UUID NOT NULL,
            CONSTRAINT uq_workflow_process UNIQUE (workflow_id, process_id),
            CONSTRAINT uq_workflow_process_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS workflow_process_step (
            id                   BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            workflow_process_id  BIGINT NOT NULL,
            step_id              BIGINT NOT NULL,
            sequence_order       INT NOT NULL,
            required_team_id     BIGINT,
            public_id            UUID NOT NULL,
            CONSTRAINT uq_workflow_process_step UNIQUE (workflow_process_id, step_id),
            CONSTRAINT uq_workflow_process_step_public_id UNIQUE (public_id)
          );
    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS demand (
            id              BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            reference       VARCHAR(50) NOT NULL UNIQUE,
            workflow_id     BIGINT NOT NULL,
            amount          DECIMAL(15,2) NOT NULL,
            duration        INT NOT NULL,
            created_at      TIMESTAMP NOT NULL,
            completed_at    TIMESTAMP,
            applicable_rate DECIMAL(5,2),
            contact_email   VARCHAR(150),
            contact_phone   VARCHAR(20),
            contact_language VARCHAR(2),
            rejected_at     TIMESTAMP,
            version         BIGINT NOT NULL DEFAULT 0,
            deleted_at      TIMESTAMP,
            public_id       UUID NOT NULL,
            demand_type     VARCHAR(20) NOT NULL DEFAULT 'ENTERPRISE',
            contact_name    VARCHAR(200) NOT NULL,
            CONSTRAINT uq_demand_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS enterprise_demand_detail (
            demand_id                     BIGINT PRIMARY KEY,
            enterprise_type               VARCHAR(20) NOT NULL,
            annual_revenue                DECIMAL(15,2),
            existing_annual_debt_service  DECIMAL(15,2),
            net_annual_result             DECIMAL(15,2),
            guarantees_value              DECIMAL(15,2),
            enterprise_id                 BIGINT,
            sector                        VARCHAR(100),
            company_age_years             INT
          );

          CREATE TABLE IF NOT EXISTS mortgage_demand_detail (
            demand_id                    BIGINT PRIMARY KEY,
            product_type                 VARCHAR(20) NOT NULL,
            csp_code                     VARCHAR(10),
            nationality_code             VARCHAR(10),
            moroccan_resident            BOOLEAN,
            property_value               DECIMAL(15,2),
            monthly_income               DECIMAL(15,2),
            age                          INT,
            co_borrower                  BOOLEAN,
            co_borrower_monthly_income   DECIMAL(15,2)
          );

          CREATE TABLE IF NOT EXISTS workflow_process_step_demand (
            id                            BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            demand_id                     BIGINT NOT NULL,
            workflow_process_step_id      BIGINT NOT NULL,
            assigned_username             VARCHAR(100),
            entered_at                    TIMESTAMP NOT NULL,
            exited_at                     TIMESTAMP,
            decision_note                 VARCHAR(500),
            decision_outcome              VARCHAR(20),
            return_reason_code            VARCHAR(100),
            recommendations               VARCHAR(500),
            reserves                      VARCHAR(500),
            committee_type                VARCHAR(20),
            assigned_by                   VARCHAR(100),
            rate_option                   VARCHAR(20),
            previous_rate                 DECIMAL(5,2),
            applied_rate                  DECIMAL(5,2),
            rate_changed_by               VARCHAR(100),
            closed_by                     VARCHAR(100),
            amount_option                 VARCHAR(20),
            previous_amount               DECIMAL(15,2),
            applied_amount                DECIMAL(15,2),
            duration_option               VARCHAR(20),
            previous_duration             INT,
            applied_duration              INT,
            classification_outcome        VARCHAR(20),
            insurance_adi_subscribed      BOOLEAN,
            insurance_coverage_type       VARCHAR(30),
            insurance_damage_subscribed   BOOLEAN,
            public_id                     UUID NOT NULL,
            CONSTRAINT uq_workflow_process_step_demand_public_id UNIQUE (public_id)
          );
    - sql:
        dbms: h2
        sql: |
          ALTER TABLE workflow_process_step_demand
            ADD COLUMN open_demand_id BIGINT
            GENERATED ALWAYS AS (CASE WHEN exited_at IS NULL THEN demand_id ELSE NULL END);
          CREATE UNIQUE INDEX IF NOT EXISTS idx_workflow_process_step_demand_one_open_per_demand
          ON workflow_process_step_demand (open_demand_id);
    - sql:
        dbms: postgresql
        sql: |
          ALTER TABLE workflow_process_step_demand
            ADD COLUMN open_demand_id BIGINT
            GENERATED ALWAYS AS (CASE WHEN exited_at IS NULL THEN demand_id ELSE NULL END) STORED;
          CREATE UNIQUE INDEX IF NOT EXISTS idx_workflow_process_step_demand_one_open_per_demand
          ON workflow_process_step_demand (open_demand_id);
