    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS demand_comment (
            id         BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            demand_id  BIGINT NOT NULL,
            step_code  VARCHAR(50) NOT NULL,
            step_name  VARCHAR(200) NOT NULL,
            username   VARCHAR(100) NOT NULL,
            comment    VARCHAR(1000) NOT NULL,
            created_at TIMESTAMP NOT NULL,
            public_id  UUID NOT NULL,
            CONSTRAINT uq_demand_comment_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS demand_document (
            id                BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            demand_id         BIGINT NOT NULL,
            step_code         VARCHAR(50) NOT NULL,
            step_name         VARCHAR(200) NOT NULL,
            original_filename VARCHAR(255) NOT NULL,
            stored_filename   VARCHAR(100) NOT NULL,
            content_type      VARCHAR(100) NOT NULL,
            size_bytes        BIGINT NOT NULL,
            checksum_sha256   VARCHAR(64) NOT NULL,
            document_type     VARCHAR(50),
            status            VARCHAR(20) NOT NULL DEFAULT 'ACTIVE',
            scan_status       VARCHAR(20) NOT NULL DEFAULT 'PENDING',
            superseded_by_id  BIGINT,
            uploaded_by       VARCHAR(100) NOT NULL,
            uploaded_at       TIMESTAMP NOT NULL,
            public_id         UUID NOT NULL,
            CONSTRAINT uq_demand_document_stored_filename UNIQUE (stored_filename),
            CONSTRAINT uq_demand_document_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS document_request (
            id                     BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            demand_id              BIGINT NOT NULL,
            document_type          VARCHAR(50) NOT NULL,
            status                 VARCHAR(30) NOT NULL DEFAULT 'PENDING',
            requested_by_username  VARCHAR(100) NOT NULL,
            created_at             TIMESTAMP NOT NULL,
            fulfilled_document_id  BIGINT,
            fulfilled_at           TIMESTAMP,
            public_id              UUID NOT NULL,
            CONSTRAINT uq_document_request_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS demand_assignment_history (
            id                 BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            demand_id          BIGINT NOT NULL,
            step_code          VARCHAR(50) NOT NULL,
            step_name          VARCHAR(200) NOT NULL,
            previous_username  VARCHAR(100),
            new_username       VARCHAR(100) NOT NULL,
            assigned_by        VARCHAR(100) NOT NULL,
            assigned_at        TIMESTAMP NOT NULL,
            public_id          UUID NOT NULL,
            CONSTRAINT uq_demand_assignment_history_public_id UNIQUE (public_id)
          );
    - sql:
        sql: |
          CREATE TABLE IF NOT EXISTS enterprise (
            id                   BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name                 VARCHAR(200) NOT NULL,
            sector               VARCHAR(100),
            created_at           TIMESTAMP NOT NULL,
            normalized_name      VARCHAR(200),
            registration_number  VARCHAR(50),
            rib                  VARCHAR(34),
            public_id            UUID NOT NULL,
            CONSTRAINT uq_enterprise_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS enterprise_user_link (
            id                            BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            enterprise_id                 BIGINT NOT NULL,
            user_id                       BIGINT NOT NULL,
            role                          VARCHAR(20) NOT NULL,
            status                        VARCHAR(20) NOT NULL,
            origin                        VARCHAR(40) NOT NULL,
            claimed_registration_number   VARCHAR(50),
            requested_by_username         VARCHAR(100) NOT NULL,
            decided_by_username           VARCHAR(100),
            decided_at                    TIMESTAMP,
            created_at                    TIMESTAMP NOT NULL,
            public_id                     UUID NOT NULL,
            CONSTRAINT uq_enterprise_user_link_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS client_invitation (
            id                    BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            email                 VARCHAR(255) NOT NULL,
            token_hash            VARCHAR(64) NOT NULL,
            enterprise_id         BIGINT NOT NULL,
            role                  VARCHAR(20) NOT NULL,
            demand_id             BIGINT,
            status                VARCHAR(20) NOT NULL,
            created_by_username   VARCHAR(100) NOT NULL,
            created_at            TIMESTAMP NOT NULL,
            expires_at            TIMESTAMP NOT NULL,
            accepted_at           TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS activity_sector (
            id         BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name       VARCHAR(100) NOT NULL,
            created_at TIMESTAMP NOT NULL,
            public_id  UUID NOT NULL,
            CONSTRAINT uq_activity_sector_public_id UNIQUE (public_id)
          );

          CREATE TABLE IF NOT EXISTS document_suggestion (
            id              BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            enterprise_type VARCHAR(30),
            label           VARCHAR(200) NOT NULL,
            created_at      TIMESTAMP NOT NULL,
            public_id       UUID NOT NULL,
            client_scope    VARCHAR(20) NOT NULL DEFAULT 'ENTERPRISE',
            csp_code        VARCHAR(10),
            CONSTRAINT uq_document_suggestion_public_id UNIQUE (public_id)
          );
    - sql:
        dbms: h2
        sql: |
          ALTER TABLE enterprise_user_link
            ADD COLUMN active_link_key VARCHAR(120)
            GENERATED ALWAYS AS (CASE WHEN status IN ('PENDING', 'APPROVED')
              THEN enterprise_id || ':' || user_id ELSE NULL END);
          CREATE UNIQUE INDEX IF NOT EXISTS idx_enterprise_user_link_unique_active
          ON enterprise_user_link (active_link_key);

          ALTER TABLE client_invitation
            ADD COLUMN active_invitation_key VARCHAR(280)
            GENERATED ALWAYS AS (CASE WHEN status = 'PENDING'
              THEN email || ':' || enterprise_id ELSE NULL END);
          CREATE UNIQUE INDEX IF NOT EXISTS idx_client_invitation_unique_active
          ON client_invitation (active_invitation_key);
    - sql:
        dbms: postgresql
        sql: |
          ALTER TABLE enterprise_user_link
            ADD COLUMN active_link_key VARCHAR(120)
            GENERATED ALWAYS AS (CASE WHEN status IN ('PENDING', 'APPROVED')
              THEN enterprise_id || ':' || user_id ELSE NULL END) STORED;
          CREATE UNIQUE INDEX IF NOT EXISTS idx_enterprise_user_link_unique_active
          ON enterprise_user_link (active_link_key);

          ALTER TABLE client_invitation
            ADD COLUMN active_invitation_key VARCHAR(280)
            GENERATED ALWAYS AS (CASE WHEN status = 'PENDING'
              THEN email || ':' || enterprise_id ELSE NULL END) STORED;
          CREATE UNIQUE INDEX IF NOT EXISTS idx_client_invitation_unique_active
          ON client_invitation (active_invitation_key);
