spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.h2.console.enabled=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=900000
security.cookie.max-age-seconds=900
security.cookie.secure=true
security.refresh-cookie.max-age-seconds=604800

security.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

spring.liquibase.contexts=prod

logging.level.root=WARN
logging.level.com.credit.bladi=INFO
