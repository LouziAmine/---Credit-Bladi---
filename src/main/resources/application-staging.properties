spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.h2.console.enabled=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=900000
security.cookie.max-age-seconds=900
security.cookie.secure=true

security.cors.allowed-origin=https://staging.bladi-credit.ma

swagger.public=true

spring.liquibase.contexts=staging

logging.level.root=INFO
logging.level.com.credit.bladi=DEBUG

app.document-storage.base-path=${DOCUMENT_STORAGE_PATH}
app.document-storage.encryption-key=${DOCUMENT_ENCRYPTION_KEY}
app.document-storage.antivirus.enabled=true
app.document-storage.antivirus.host=${CLAMAV_HOST}
app.document-storage.antivirus.port=${CLAMAV_PORT:3310}

# Fail closed: no silent fallback to the demo SMS sink, the mock BAM gateway or the demo beneficiary RIB.
# Startup fails until each of these is set explicitly (a demo deployment may still choose mailpit / mock).
sms.gateway.provider=${SMS_GATEWAY_PROVIDER}
bam.verification.provider=${BAM_VERIFICATION_PROVIDER}
credit.bladi.payment.beneficiary-rib=${PAYMENT_BENEFICIARY_RIB}
