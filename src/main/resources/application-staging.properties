spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.h2.console.enabled=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=900000
security.cookie.max-age-seconds=900
security.cookie.secure=true

security.cors.allowed-origin=https://staging.bladi-credit.ma

swagger.public=true

spring.liquibase.contexts=staging

logging.level.root=INFO
logging.level.com.credit.bladi=DEBUG
