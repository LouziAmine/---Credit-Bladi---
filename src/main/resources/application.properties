spring.application.name=Credit-Bladi

spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties],classpath:i18n/basenames.properties

server.port=8080

spring.liquibase.enabled=true

springdoc.api-docs.path=/swagger/credit-bladi/v3/api-docs.json
springdoc.swagger-ui.path=/swagger/credit-bladi/v3/swagger-ui.html
springdoc.swagger-ui.version=@swagger-ui.version@
code.version=@project.version@
credit.bladi.swagger.config.title=Credit Bladi API
credit.bladi.swagger.config.description=Moroccan mortgage simulator API: BAM regulatory rules (Bank Al-Maghrib)
credit.bladi.swagger.config.package=com.credit.bladi
credit.bladi.swagger.config.contact.name=Amine Louzi
credit.bladi.swagger.config.contact.email=louzi.amine.pro.pro@gmail.com

spring.jackson.deserialization.fail-on-trailing-tokens=true

spring.jpa.open-in-view=false

security.jwt.expiration-ms=86400000
security.cookie.max-age-seconds=86400

security.jwt.refresh-expiration-ms=604800000
security.refresh-cookie.max-age-seconds=604800

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=MANAGER
management.info.env.enabled=true

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

app.document-storage.max-file-size-bytes=15728640
app.document-storage.allowed-content-types=application/pdf,image/jpeg,image/png,\
application/vnd.openxmlformats-officedocument.wordprocessingml.document,\
application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false
app.demand-import.max-file-size-bytes=15728640
app.demand-import.storage-path=${DEMAND_IMPORT_STORAGE_PATH:./data/demand-imports}
app.demand-import.max-skip-count=50

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Bounded SMTP calls: an unresponsive relay must never hold a notification thread forever.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Notifications are sent asynchronously after commit: a mail outage must not mark the whole service DOWN
# for load balancers and orchestrators.
management.health.mail.enabled=false
notification.email.enabled=true
notification.email.from=${SMTP_FROM:no-reply@bladi-credit.ma}

notification.sms.enabled=true
notification.sms.fakeCatcherAddress=${SMS_FAKE_CATCHER:sms-catcher@bladi-credit.ma}
sms.gateway.provider=${SMS_GATEWAY_PROVIDER:mailpit}
sms.gateway.url=${SMS_GATEWAY_URL:}
sms.gateway.api-key=${SMS_GATEWAY_API_KEY:}
sms.gateway.sender-id=${SMS_GATEWAY_SENDER_ID:CreditBladi}

credit.bladi.payment.beneficiary-name=${PAYMENT_BENEFICIARY_NAME:Credit Bladi SA}
credit.bladi.payment.beneficiary-rib=${PAYMENT_BENEFICIARY_RIB:230 780 0123456789012345 03}

bam.verification.provider=${BAM_VERIFICATION_PROVIDER:mock}
bam.verification.mock.latency.min-ms=${BAM_VERIFICATION_MOCK_LATENCY_MIN_MS:500}
bam.verification.mock.latency.max-ms=${BAM_VERIFICATION_MOCK_LATENCY_MAX_MS:1500}
bam.verification.gateway.url=${BAM_VERIFICATION_GATEWAY_URL:}
bam.verification.gateway.api-key=${BAM_VERIFICATION_GATEWAY_API_KEY:}

workflow.four-eyes.enabled=true

credit.bladi.regulatory.max-annual-rate=${MAX_ANNUAL_RATE:14.00}
# NOMINAL or TEG: the rate a simulation is compared with against the ceiling (legal basis to confirm with compliance)
credit.bladi.regulatory.simulation-rate-basis=${MAX_RATE_SIMULATION_BASIS:NOMINAL}

notification.locale=fr

credit.bladi.servicing.late-interest-margin-points=${LATE_INTEREST_MARGIN_POINTS:2.00}
credit.bladi.servicing.early-repayment.indemnity-months-of-interest=1
credit.bladi.servicing.early-repayment.max-indemnity-share-of-outstanding=0.03
